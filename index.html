<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="modern-normalize.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left">
        <div class="left-logo">
            <div class="icon"></div>
            <div class="title">
                <p>ODIN</p>
            </div>
        </div>
    </div>
    <div class="right">
        <div class="top">
            <div>
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams.<br>Sign up now to get started.</p>
            </div>
            <div>
                <p>
                    You know you want to.
                </p>
            </div>
        </div>
        <div class="bottom">
            <form action="" method="">
                <div class="input-container">
                    <div class="input-title">
                        <p>Let's do this!</p>
                    </div>
                    <div class="input-group">
                        <div class="input-left">
                            <div class="left-name">
                                <label for="fName">First Name</label>
                                <input type="text" id="fName" name="fName" required>
                            </div>
                            <div class="left-email">
                                <label for="email">Email</label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    required>
                            </div>
                            <div class="left-password">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                        </div>
                        <div class="input-right">
                            <div class="right-name">
                                <label for="lName">Last Name</label>
                                <input type="text" id="lName" name="lName" required>
                            </div>
                            <div class="right-phone">
                                <label for="phone">Phone Number</label>
                                <input 
                                    type="text" 
                                    id="phone" 
                                    name="phone" 
                                    minlength="10"
                                    maxlength="10"
                                    required>
                            </div>
                            <div class="right-password2">
                                <label for="password2">Confirm Password</label>
                                <input type="password" id="password2" name="password2" required>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="input-button">
                    <button type="submit">Create Account</button>
                    <div class="button-login">
                        <p>
                            Already have an account?&nbsp;
                            <a href="http://">
                                Log in
                            </a>
                        </p>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
